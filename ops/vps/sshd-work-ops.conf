# work-ops VPS (decision #24). Installed as /etc/ssh/sshd_config.d/20-work-ops.conf by ops/vps/harden.sh.
# The Include comes before the main file's settings, so these take precedence.
X11Forwarding no
# Nothing here uses a forwarded agent (deploys use the VPS's own read-only key; codex uses gh over
# HTTPS). Refusing it means root on this server can never sign with a Mac's agent keys (GitHub).
AllowAgentForwarding no
# TCP forwarding stays on: ops/vps/open.sh uses an SSH port-forward as the fallback route to the site.
