# work-ops VPS (decision #24): run the tunnel connector as its own user in a sandbox.
# Installed as /etc/systemd/system/cloudflared.service.d/work-ops.conf by ops/vps/harden.sh tunnel,
# which also creates the user and lets it read the tunnel credentials. Undo: ops/vps/harden.sh tunnel-revert.
[Service]
User=cloudflared
Group=cloudflared
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
