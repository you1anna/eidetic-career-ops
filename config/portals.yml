job_boards: []   # superseded by `feeds:` below, which is actually read by the scanner

# ---------------------------------------------------------------------------------------------
# Query feeds — the channel the tracked boards above structurally cannot cover.
#
# A tracked board is one employer's own vacancies, and a UK employer's own headcount is
# overwhelmingly permanent: the 14–16 September runs read ~10,000 jobs across 61 boards and returned
# 176 candidates, of which 0 were contract and 0 carried a day rate. UK contract work is brokered,
# and reaches the market through aggregators and agency desks. These feeds query the whole market by
# role and engagement instead of by company, so the company name arrives in the payload.
#
# Credentials are read from the environment and are never stored here or in the repository.
# Local per-run caps are below; account-wide remaining quota is not known.
#
# Both search schema probes passed on 24 September 2026. Daily keyed reads were approved on
# 1 October (#39); the deployed wrapper selects those approved sources explicitly. See channels.yml
# for source status and archive/docs/provider-validation-2026-09-24.md for the original probe evidence.
#   ADZUNA_APP_ID=... ADZUNA_APP_KEY=... python3 tools/scan_boards.py --probe adzuna
#   REED_API_KEY=...                     python3 tools/scan_boards.py --probe reed
# The probe prints a field-by-field verdict. A mismatch names the fields that moved.
# Keys: developer.adzuna.com (Trial Access) · reed.co.uk/developers.
# One exact-phrase search per role; overlapping results are deduplicated after retrieval.
# Adzuna's what_or matches single words ("head", "of"), which returned nearly every London advert and
# truncated the relevant ones, so phrases replace it. Contract and permanent are both read; the
# engagement tag from each advert keeps contract work first in the ranking (24 Sep 2026).
# Collection ceilings, pacing, detail budgets and observed account limits live in collection.yml.
role_phrases: &role_phrases
  # 30 October: five leadership, four AI, three delivery/integration/productivity,
  # three quality leadership searches. Interleaved under the unchanged provider caps.
  - head of engineering
  - AI engineer
  - integration engineer
  - engineering manager
  - head of AI
  - developer productivity
  - director of engineering
  - forward deployed engineer
  - head of delivery
  - VP engineering
  - AI evaluation
  - interim CTO
  - head of quality
  - QA lead
  - test manager

feeds:
  - name: Adzuna UK — remote, whole country
    provider: adzuna
    enabled: true
    params:
      country: gb
      what: "remote"
      phrases: [head of engineering, AI engineer, integration engineer, engineering manager, head of AI, developer productivity]
      max_days_old: 14
      sort_by: date
      results_per_page: 50
      max_pages: 1
      app_id_env: ADZUNA_APP_ID
      app_key_env: ADZUNA_APP_KEY

  - name: Adzuna UK — London QA and engineering leadership
    provider: adzuna
    enabled: true
    params:
      country: gb
      phrases: *role_phrases
      what_exclude: "graduate junior apprentice"
      where: "London"
      distance: 40
      max_days_old: 14
      sort_by: date
      results_per_page: 50
      max_pages: 1
      app_id_env: ADZUNA_APP_ID
      app_key_env: ADZUNA_APP_KEY

  - name: Reed UK — London QA and engineering leadership
    provider: reed
    enabled: true
    params:
      phrases: *role_phrases
      where: "London"
      distance_miles: 40
      results_per_page: 100
      max_pages: 1
      api_key_env: REED_API_KEY

# ---------------------------------------------------------------------------------------------
# Published contract demand — the direct, outside-IR35 market, read by tools/scan_tenders.py.
#
# `rates.md` names three markets and `decisions/2026-09-03-contract-first-september.md` names
# running only the easiest of them as the failure mode. Agency day-rate work is what the feeds
# above find. This section covers the second: buyers who have published an intention to pay an
# outside supplier. Unlike a job advert, a notice states a buyer, a budget and a deadline.
#
# Neither service needs an API key or an account, so there is no credential to obtain and no cost.
# Confirm the schema before enabling, as with the feeds:
#   python3 tools/scan_tenders.py --probe all
#
# A notice is a buying signal, not a qualified opportunity: it does not show that the owner can win it,
# that the timetable is open, or that a direct supply route exists. wo ingest can import matching
# candidates as records; that does not qualify a buying route or contact anyone.
tenders:
  filter:
    # CPV is the EU/UK procurement classification. 722x software, 725x/726x computer services,
    # 7940x business and management consultancy.
    cpv_prefixes: ["722", "725", "726", "7940", "73110"]
    # Single words match as words; phrases match as substrings.
    keywords:
      - "test"
      - "testing"
      - "quality assurance"
      - "test management"
      - "software assurance"
      - "technical assurance"
      - "delivery partner"
      - "digital delivery"
      - "engineering capability"
      - "platform modernisation"
      - "legacy migration"
      - "service reliability"
      - "AI assurance"
      - "model evaluation"
      - "evaluation framework"
    negative: ["cleaning", "catering", "construction", "groundworks", "vehicle", "furniture",
               "stationery", "security guarding", "waste", "highways"]
    # Below this the work is too small to be worth a supplier route. An unstated value is an
    # unknown and is kept, not rejected.
    minimum_value_gbp: 50000
  sources:
    - name: Contracts Finder
      source: contracts_finder
      enabled: true
      params: {stages: tender, page_size: 100, max_pages: 10}
    - name: Find a Tender
      source: find_a_tender
      enabled: true
      params: {stages: tender, page_size: 100, max_pages: 10}

# Awarded suppliers are potential delivery partners, not open tender opportunities. Free official
# APIs; existing daily ingest; no new account/timer. Updated notices are bounded to seven days,
# two pages per provider. Actual award dates remain separate from notice update dates.
# Uses tenders.filter; missing value is unknown, and award value is never subcontract budget.
commercial_awards:
  sources:
    - name: Contracts Finder awards
      source: contracts_finder
      enabled: true
      params: {page_size: 100, max_pages: 2}
    - name: Find a Tender awards
      source: find_a_tender
      enabled: true
      params: {page_size: 100, max_pages: 2}

hn_who_is_hiring:
  enabled: true
  max_pages: 10

# ---------------------------------------------------------------------------------------------
# Selected Gmail alerts reach the private Cloudflare buffer, then the VPS spool.
# The dedicated wo-email.timer runs the parser/importer; receipt does not prove vacancy freshness.
alerts:
  enabled: true
  transport: spool
  spool_path: /srv/work-ops/data/email/mail.db
  max_messages: 200
  # Exact sender identities are owned by config/email-sources.json, shared with the buffer.

# Funding news, read by tools/scan_news.py (25 Sep 2026). A company that has just raised money
# is a trigger for a direct approach about interim or fractional engineering and quality leadership,
# before any advert exists. Public RSS, no key. Presence-only; a story is kept only when its headline
# states a company raise with an amount at or above the feed's floor (in millions of the stated
# currency; no conversion). Fund raises are dropped. See archive/docs/source-research-2026-09-25.md.
signals:
  funding_news:
    - id: uktn
      name: UKTN funding news
      url: https://www.uktech.news/funding/feed
      region: UK
      min_amount_millions: 1
      enabled: true
    - id: techeu
      name: tech.eu news
      url: https://tech.eu/feed/
      region: Europe
      min_amount_millions: 10
      enabled: false  # 1 Oct (#33): its robots.txt disallows /feed/ for automated readers
  # A raise that is not a growth signal: debt, or a story about cutting jobs.
  exclude_terms: [" in debt", "debt financing", "debt facility", "headcount cut", "layoff", "job cuts", "redundanc"]
  # Leading words that describe a company rather than name it ("Fintech Foo raises …").
  descriptors: [fintech, insurtech, proptech, healthtech, medtech, edtech, legaltech, regtech, cleantech,
                climatetech, deeptech, traveltech, agritech, foodtech, martech, adtech, govtech, cybersecurity,
                startup, scaleup, unicorn, british, uk, london, scottish, welsh, irish, english, european,
                french, german, dutch, swedish, danish, norwegian, finnish, spanish, italian, polish, swiss,
                estonian, belgian, austrian, portuguese, lithuanian, latvian, czech, greek, ai, saas, b2b]
