# Shared job rules tag each candidate: contract | interim | ftc | permanent | unknown. Fractional
# wording normalises to interim. Contract-first: contract/interim/ftc rows sort first; permanent
# rows are kept (suitable permanent work remains eligible) but shown separately.
engagement_filter:
  # Strong markers count as whole words in title / location / employment type.
  strong_markers: ["contract", "contractor", "interim", "fractional", "freelance", "fixed-term", "fixed term", "ftc", "temporary"]
  # Text markers must be specific phrases; bare "contract" and "b2b" tagged marketing roles on the first run.
  text_markers: ["day rate", "per day", "/day", "outside ir35", "inside ir35", "ir35", "umbrella company", "month contract", "months contract", "month initial contract", "contract role", "contract position", "fixed-term contract", "fixed term contract", "initial term of", "rolling contract"]
  minimum_day_rate_gbp: 450      # floor, not the ask; unstated rates are kept and flagged
  prefer: ["contract", "interim", "fractional", "ftc"]

location_filter:
  # London-based, London travel, no relocation, no regular travel abroad. Remote foreign work is
  # considered when the actual working hours sit within ±6h of UK.
  # Short tokens (<=3 chars) match as whole words; "et" no longer matches "Detroit".
  accept_any_of: ["london", "remote", "united kingdom", "uk", "england", "scotland", "wales", "emea", "europe", "hybrid", "work from home", "wfh", "ireland", "dublin", "netherlands", "amsterdam", "germany", "berlin", "munich", "sweden", "stockholm", "denmark", "copenhagen", "norway", "oslo", "finland", "helsinki", "switzerland", "zurich", "belgium", "brussels", "france", "paris", "spain", "madrid", "barcelona", "portugal", "lisbon", "italy", "poland", "warsaw", "dubai", "uae", "abu dhabi", "new york", "boston", "toronto", "montreal", "us east", "us-east", "eastern time", "eastern"]
  # Rejects are checked first, then named US regions/cities (scanner built-in, incl. multi-city US listings and
  # "United States (Remote)"), then this accept list. Location labels never establish UK eligibility alone.
  reject_any_of: ["on-site only", "onsite only", "relocation required", "must be based in the us", "us only", "usa only", "australia", "sydney", "melbourne", "singapore", "tokyo", "japan", "india", "bangalore", "bengaluru", "pune", "hyderabad", "taiwan", "korea", "seoul", "china", "brazil", "serbia", "saudi", "riyadh", "mexico", "argentina", "colombia", "latam"]

search_queries:
  # Attended discovery references only: no automated adapter reads these queries or enabled flags.
  # UK contract boards (discovery only; qualify on the primary recruiter/employer advert)
  - name: Jobserve — contract test manager / QA leadership
    query: 'site:jobserve.com contract "Test Manager" OR "Head of QA" OR "QA Lead" OR "Head of Quality" London'
    enabled: true
  - name: Jobserve — interim engineering leadership
    query: 'site:jobserve.com contract "Head of Engineering" OR "Engineering Manager" OR "Interim" London'
    enabled: true
  - name: CWJobs — contract test manager
    query: 'site:cwjobs.co.uk contract "Test Manager" OR "QA Lead" OR "Head of QA" London'
    enabled: true
  - name: TotalJobs — contract test manager
    query: 'site:totaljobs.com contract "Test Manager" OR "Head of Quality" London'
    enabled: true
  - name: Contractor UK — QA and engineering leadership
    query: 'site:contractoruk.com "Test Manager" OR "QA Lead" OR "Head of Engineering" contract'
    enabled: true
  - name: Technojobs / Reed — contract engineering leadership
    query: 'site:technojobs.co.uk OR site:reed.co.uk contract "Head of Engineering" OR "Engineering Manager" OR "Test Manager" London'
    enabled: true
  - name: LinkedIn — interim head of QE / engineering (discovery only, no LinkedIn applications)
    query: 'site:linkedin.com/jobs "Head of Quality Engineering" OR "Interim Head of QA" OR "Interim Head of Engineering" contract London'
    enabled: true
  - name: AI evaluation contracts UK
    query: '"AI evaluation" OR "LLM evaluation" OR "evals" contract "day rate" OR "outside IR35" UK'
    enabled: true
  - name: Systems delivery — UK and Ireland contracts
    query: '"contract" "integration engineer" "UK" OR "Ireland"'
    enabled: true
  - name: Engineering productivity — Europe contract or interim
    query: '"engineering productivity" "contract" OR "interim" "Europe"'
    enabled: true
  - name: Operational integration — named delivery partners
    query: '"implementation partner" "workflow" "client" "2026"'
    enabled: true
  # Overseas remote (remote-only; no regular travel abroad)
  - name: Ireland remote-only contracts
    query: 'site:irishjobs.ie OR site:brightwater.ie OR site:sigmarrecruitment.com contract "fully remote" "Test Manager" OR "QA Lead" OR "Engineering Manager"'
    enabled: true
  - name: Nordics remote assignments (Ework)
    query: 'site:eworkgroup.com remote "test manager" OR "engineering manager" OR "quality" assignment'
    enabled: true
  - name: Netherlands remote assignments
    query: 'site:striive.com OR site:headfirst.nl remote English "test manager" OR "engineering manager" OR "QA lead"'
    enabled: true
  - name: HN Who is hiring — current month
    # Select the current month's thread; scan_hn.py finds that thread dynamically.
    query: 'site:news.ycombinator.com "Who is hiring" contract remote UK OR Europe'
    enabled: true
  - name: Remote boards — contract engineering leadership
    query: 'site:weworkremotely.com OR site:remoteok.com OR site:remotive.com OR site:himalayas.app contract "engineering manager" OR "head of engineering" OR "QA lead" Europe OR UK'
    enabled: true

