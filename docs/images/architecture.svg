<title id="title">work/ops architecture</title>
<desc id="description">Employer job boards, tenders and filings, and job-alert email feed collection on the server, which records a receipt for every read. Every write goes through one record service. Ranking on read turns the records into reasons and unknowns on the workspace site, which you open on desktop or iPhone behind Cloudflare Access. Twice a day the research worker sends selected context to a model session in a sandbox with no shell and no database, then validates the answer before recording findings. Coding agents reach the records only through the agent gateway, which allows record-level edits.</desc>
