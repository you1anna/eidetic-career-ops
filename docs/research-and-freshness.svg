<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1740" viewBox="0 0 1800 1740" role="img" aria-label="Research | evidence, decisions and limits"><title>Research | evidence, decisions and limits</title><desc>26 October 2026 • Evidence-only research • Successful execution is not proof of useful output</desc><defs><marker id="flow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#257b7a"/></marker><marker id="research" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7660a4"/></marker><marker id="admin" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8b6d37"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1800" height="1740" fill="#f5f8f8"/>
<text x="40" y="58" font-size="38" fill="#173c3b" font-weight="700">Research | evidence, decisions and limits</text>
<text x="40" y="96" font-size="20" fill="#51686b" font-weight="400">26 October 2026 • Evidence-only research • Successful execution is not proof of useful output</text>
<text x="40" y="133" font-size="18" fill="#51686b" font-weight="400">Solid teal: server data flow  •  Dashed purple: model-assisted research  •  Dashed brown: human action / administration</text>
<rect x="40" y="180" width="1720" height="280" rx="20" fill="#f1edf8" stroke="#c9d9d8" stroke-width="2"/>
<text x="62" y="215" font-size="22" fill="#173c3b" font-weight="700">1  SELECT • twice daily; no Mac needed</text>
<g data-box="Maintained set"><rect x="70" y="245" width="480" height="190" rx="14" fill="#f1edf8" stroke="#b7a7ce" stroke-width="2"/>
<text x="90" y="278" font-size="22" fill="#173c3b" font-weight="700">Maintained set</text>
<text x="90" y="309" font-size="18" fill="#51686b" font-weight="400">Active/shortlisted work and the top ten</text>
<text x="90" y="333" font-size="18" fill="#51686b" font-weight="400">discovery opportunities. One shared</text>
<text x="90" y="357" font-size="18" fill="#51686b" font-weight="400">server policy. Excluded, skipped,</text>
<text x="90" y="381" font-size="18" fill="#51686b" font-weight="400">archived and closed targets stay out.</text>
</g>
<g data-box="Recorded context + public reads"><rect x="650" y="245" width="480" height="190" rx="14" fill="#f1edf8" stroke="#b7a7ce" stroke-width="2"/>
<text x="670" y="278" font-size="22" fill="#173c3b" font-weight="700">Recorded context + public reads</text>
<text x="670" y="309" font-size="18" fill="#51686b" font-weight="400">Work remit, fit, terms and known gaps.</text>
<text x="670" y="333" font-size="18" fill="#51686b" font-weight="400">Exact public pages, up to four discovery</text>
<text x="670" y="357" font-size="18" fill="#51686b" font-weight="400">alternatives. Saved private sources are</text>
<text x="670" y="381" font-size="18" fill="#51686b" font-weight="400">context only; no private mail fetch.</text>
</g>
<g data-box="Durable allowance admission"><rect x="1230" y="245" width="480" height="190" rx="14" fill="#fff4db" stroke="#d3ae64" stroke-width="2"/>
<text x="1250" y="278" font-size="22" fill="#173c3b" font-weight="700">Durable allowance admission</text>
<text x="1250" y="309" font-size="18" fill="#51686b" font-weight="400">6 calls/pass; 12/day, 84/week; 30</text>
<text x="1250" y="333" font-size="18" fill="#51686b" font-weight="400">targets/pass. Failed/unknown calls count.</text>
<text x="1250" y="357" font-size="18" fill="#51686b" font-weight="400">A cap leaves targets waiting. Existing</text>
<text x="1250" y="381" font-size="18" fill="#51686b" font-weight="400">schedules remain.</text>
</g>
<path d="M550,330 L650,330" fill="none" stroke="#7660a4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#research)"/>
<path d="M1130,330 L1230,330" fill="none" stroke="#7660a4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#research)"/>
<rect x="40" y="500" width="1720" height="320" rx="20" fill="#f1edf8" stroke="#c9d9d8" stroke-width="2"/>
<text x="62" y="535" font-size="22" fill="#173c3b" font-weight="700">2  ASSESS EVIDENCE • reuse current findings; research decisive gaps</text>
<g data-box="Current context: reuse or refresh"><rect x="70" y="565" width="480" height="205" rx="14" fill="#f1edf8" stroke="#b7a7ce" stroke-width="2"/>
<text x="90" y="598" font-size="22" fill="#173c3b" font-weight="700">Current context: reuse or refresh</text>
<text x="90" y="629" font-size="18" fill="#51686b" font-weight="400">Reuse current checks and unchanged</text>
<text x="90" y="653" font-size="18" fill="#51686b" font-weight="400">context. Rotate eligible work by oldest</text>
<text x="90" y="677" font-size="18" fill="#51686b" font-weight="400">attempt. Never generate outgoing wording</text>
<text x="90" y="701" font-size="18" fill="#51686b" font-weight="400">or infer facts from old generated text.</text>
</g>
<g data-box="Evidence brief: support or gap"><rect x="650" y="565" width="480" height="205" rx="14" fill="#f1edf8" stroke="#b7a7ce" stroke-width="2"/>
<text x="670" y="598" font-size="22" fill="#173c3b" font-weight="700">Evidence brief: support or gap</text>
<text x="670" y="629" font-size="18" fill="#51686b" font-weight="400">Known public pages + bounded URL</text>
<text x="670" y="653" font-size="18" fill="#51686b" font-weight="400">discovery. Extract attributed quotations</text>
<text x="670" y="677" font-size="18" fill="#51686b" font-weight="400">and route claims. Unsupported or</text>
<text x="670" y="701" font-size="18" fill="#51686b" font-weight="400">ambiguous claims are withheld. No</text>
<text x="670" y="725" font-size="18" fill="#51686b" font-weight="400">evidence means an explicit gap.</text>
</g>
<g data-box="Trusted worker checks the result"><rect x="1230" y="565" width="480" height="205" rx="14" fill="#e0f1eb" stroke="#8db7a5" stroke-width="2"/>
<text x="1250" y="598" font-size="22" fill="#173c3b" font-weight="700">Trusted worker checks the result</text>
<text x="1250" y="629" font-size="18" fill="#51686b" font-weight="400">Codex cannot write records. Match claims</text>
<text x="1250" y="653" font-size="18" fill="#51686b" font-weight="400">to actual fetched text; validate identity</text>
<text x="1250" y="677" font-size="18" fill="#51686b" font-weight="400">and policy. Recheck revisions and links</text>
<text x="1250" y="701" font-size="18" fill="#51686b" font-weight="400">in a short transaction; preserve human</text>
<text x="1250" y="725" font-size="18" fill="#51686b" font-weight="400">edits and history.</text>
</g>
<path d="M310,435 L310,480 L55,480 L55,650 L70,650" fill="none" stroke="#7660a4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#research)"/>
<path d="M890,435 L1060,480 L1060,565" fill="none" stroke="#7660a4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#research)"/>
<path d="M550,680 L600,680 L600,795 L1200,795 L1200,680 L1230,680" fill="none" stroke="#7660a4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#research)"/>
<path d="M1130,640 L1230,640" fill="none" stroke="#7660a4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#research)"/>
<rect x="40" y="860" width="1720" height="285" rx="20" fill="#edf3f3" stroke="#c9d9d8" stroke-width="2"/>
<text x="62" y="895" font-size="22" fill="#173c3b" font-weight="700">3  SAVE → DISPLAY → HUMAN ACTION</text>
<g data-box="Canonical evidence + replay"><rect x="70" y="925" width="480" height="200" rx="14" fill="#e0f1eb" stroke="#8db7a5" stroke-width="2"/>
<text x="90" y="958" font-size="22" fill="#173c3b" font-weight="700">Canonical evidence + replay</text>
<text x="90" y="989" font-size="18" fill="#51686b" font-weight="400">Immutable batches precede import. Replay</text>
<text x="90" y="1013" font-size="18" fill="#51686b" font-weight="400">deduplicates and revalidates without</text>
<text x="90" y="1037" font-size="18" fill="#51686b" font-weight="400">another call; original source-read times</text>
<text x="90" y="1061" font-size="18" fill="#51686b" font-weight="400">stay intact. Save sources, read dates,</text>
<text x="90" y="1085" font-size="18" fill="#51686b" font-weight="400">checks and gaps. Old preparation batches</text>
<text x="90" y="1109" font-size="18" fill="#51686b" font-weight="400">cannot create drafts.</text>
</g>
<g data-box="Reload the site to inspect"><rect x="650" y="925" width="480" height="200" rx="14" fill="#fff" stroke="#c9d9d8" stroke-width="2"/>
<text x="670" y="958" font-size="22" fill="#173c3b" font-weight="700">Reload the site to inspect</text>
<text x="670" y="989" font-size="18" fill="#51686b" font-weight="400">Assessment: remit, fit, demand, terms and</text>
<text x="670" y="1013" font-size="18" fill="#51686b" font-weight="400">unknowns. Jobs: lifecycle and research</text>
<text x="670" y="1037" font-size="18" fill="#51686b" font-weight="400">usage. This week: active work and ranked</text>
<text x="670" y="1061" font-size="18" fill="#51686b" font-weight="400">discovery. People: relationships.</text>
</g>
<g data-box="The owner decides and records"><rect x="1230" y="925" width="480" height="200" rx="14" fill="#fff" stroke="#c9d9d8" stroke-width="2"/>
<text x="1250" y="958" font-size="22" fill="#173c3b" font-weight="700">The owner decides and records</text>
<text x="1250" y="989" font-size="18" fill="#51686b" font-weight="400">Compose and send in Gmail or apply</text>
<text x="1250" y="1013" font-size="18" fill="#51686b" font-weight="400">externally. Optionally track factual</text>
<text x="1250" y="1037" font-size="18" fill="#51686b" font-weight="400">contact, reply and next step. Historical</text>
<text x="1250" y="1061" font-size="18" fill="#51686b" font-weight="400">wording remains readable. No automatic</text>
<text x="1250" y="1085" font-size="18" fill="#51686b" font-weight="400">personal follow-ups.</text>
</g>
<path d="M1470,770 L1470,840 L55,840 L55,1015 L70,1015" fill="none" stroke="#7660a4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#research)"/>
<path d="M550,1015 L650,1015" fill="none" stroke="#257b7a" stroke-width="3"  marker-end="url(#flow)"/>
<path d="M1130,1015 L1230,1015" fill="none" stroke="#257b7a" stroke-width="3"  marker-end="url(#flow)"/>
<rect x="40" y="1185" width="1720" height="300" rx="20" fill="#edf3f3" stroke="#c9d9d8" stroke-width="2"/>
<text x="62" y="1220" font-size="22" fill="#173c3b" font-weight="700">4  FRESHNESS IS A SEPARATE QUESTION FROM CONTEXT</text>
<g data-box="Confirmed • less than 24 hours"><rect x="70" y="1250" width="480" height="190" rx="14" fill="#e0f1eb" stroke="#8db7a5" stroke-width="2"/>
<text x="90" y="1283" font-size="22" fill="#173c3b" font-weight="700">Confirmed • less than 24 hours</text>
<text x="90" y="1314" font-size="18" fill="#51686b" font-weight="400">Exact vacancy or personal/employer route</text>
<text x="90" y="1338" font-size="18" fill="#51686b" font-weight="400">supported by a source read. A profile is</text>
<text x="90" y="1362" font-size="18" fill="#51686b" font-weight="400">not proof of message delivery, hiring</text>
<text x="90" y="1386" font-size="18" fill="#51686b" font-weight="400">authority or willingness to help.</text>
</g>
<g data-box="Time passes → needs recheck"><rect x="650" y="1250" width="480" height="190" rx="14" fill="#fff4db" stroke="#d3ae64" stroke-width="2"/>
<text x="670" y="1283" font-size="22" fill="#173c3b" font-weight="700">Time passes → needs recheck</text>
<text x="670" y="1314" font-size="18" fill="#51686b" font-weight="400">A record edit, new alert or cached answer</text>
<text x="670" y="1338" font-size="18" fill="#51686b" font-weight="400">cannot refresh the clock. Cached</text>
<text x="670" y="1362" font-size="18" fill="#51686b" font-weight="400">interpretations need freshly fetched</text>
<text x="670" y="1386" font-size="18" fill="#51686b" font-weight="400">matching text. Checks under 8 hours can</text>
<text x="670" y="1410" font-size="18" fill="#51686b" font-weight="400">be skipped.</text>
</g>
<g data-box="Blocked, conflicting or unknown"><rect x="1230" y="1250" width="480" height="190" rx="14" fill="#fff4db" stroke="#d3ae64" stroke-width="2"/>
<text x="1250" y="1283" font-size="22" fill="#173c3b" font-weight="700">Blocked, conflicting or unknown</text>
<text x="1250" y="1314" font-size="18" fill="#51686b" font-weight="400">No bypass of login/robots barriers. A</text>
<text x="1250" y="1338" font-size="18" fill="#51686b" font-weight="400">later failed public check can replace</text>
<text x="1250" y="1362" font-size="18" fill="#51686b" font-weight="400">earlier public confirmation. The</text>
<text x="1250" y="1386" font-size="18" fill="#51686b" font-weight="400">owner-confirmed/prior-correspondence</text>
<text x="1250" y="1410" font-size="18" fill="#51686b" font-weight="400">evidence stays separate.</text>
</g>
<path d="M550,1340 L650,1340" fill="none" stroke="#7660a4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#research)"/>
<text x="40" y="1540" font-size="22" fill="#173c3b" font-weight="700">Possible useful output: an open advert + essential requirement; an exact public profile; a sourced remit; a decisive unknown.</text>
<text x="40" y="1585" font-size="21" fill="#8b6d37" font-weight="700">Possible honest output: no new facts, inaccessible pages or waiting targets. A completed run can have zero useful yield.</text>
<text x="40" y="1630" font-size="20" fill="#51686b" font-weight="400">Measure new action-changing evidence, unsuitable jobs ruled out and decision time saved—not calls made or green service status.</text>
<text x="40" y="1675" font-size="22" fill="#173c3b" font-weight="700">This worker maintains selected career records. It does not improve application code or deploy the site.</text></g></svg>