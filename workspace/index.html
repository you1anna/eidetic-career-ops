<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f3b"><title>work/ops</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head><body>
<aside class="rail"><a class="brand" href="#week">work<span>/</span>ops</a><nav id="nav" aria-label="Workspace"></nav><a class="system-guide-link" href="/system-map">How it works ↗</a><p class="draft-note"><strong>Private workspace.</strong><br>Nothing here sends or publishes.</p></aside>
<main><header class="topbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search every record" aria-label="Search every record"><kbd>/</kbd></label><button id="new-record" class="primary" type="button">New</button><button id="reload" type="button">Refresh</button></header><div class="status-line"><span id="connection-status" role="status">Connecting…</span><span id="loaded"></span></div><p id="alert" class="alert" role="alert" hidden></p><p id="notice" class="notice" role="status" hidden></p><header class="page-head"><div><h1 id="title">This week</h1><p id="subtitle"></p></div><div id="page-actions"></div></header><section id="content"></section></main>
<dialog id="detail" class="sheet" aria-labelledby="detail-title"><div class="sheet-head"><span id="detail-kind"></span><button id="close" type="button">Close</button></div><div id="detail-content" class="sheet-body"></div></dialog>
<dialog id="modal" class="modal" aria-labelledby="modal-title"><form id="modal-form" method="dialog"><div class="modal-head"><h2 id="modal-title">New record</h2><button id="modal-close" type="button" aria-label="Close">×</button></div><div id="modal-body"></div><div class="form-actions"><button class="primary" type="submit">Save</button><button id="modal-cancel" type="button">Cancel</button><span id="modal-status" role="status"></span></div></form></dialog>
<script type="module" src="/app.js"></script></body></html>
